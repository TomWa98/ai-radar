name: Bug
description: Fehlverhalten mit reproduzierbaren Schritten und prüfbarem Sollverhalten
title: "fix: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ein Issue wird erst nach menschlicher Prüfung mit `agent-ready` markiert.
        Keine Secrets, Tokens oder privaten Daten in Logs oder Beschreibungen einfügen.
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: Mindestens ein Regressionstest, der vor dem Fix fehlschlägt.
      placeholder: |
        - [ ] Regressionstest für …
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Nicht im Umfang
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architektur/Abhängigkeiten betroffen
      options:
        - Nein
        - Ja
    validations:
      required: true
