# Public entry point of AI Radar (D11).

# First stage of the host check: any other host name ends here and never
# reaches the backend. 444 closes the connection without a response.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 127.0.0.1 localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS: resolving at request time keeps the proxy working when a
    # rebuild gives the backend container a new address.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    # Views use hash navigation (D8), so the server only needs index.html at /.
    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # Second stage: TrustedHostMiddleware checks this original host again.
        # A fixed value here would disable that check. Origin passes unchanged.
        proxy_set_header Host $host;
        proxy_pass $backend;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_pass $backend;
    }
}
